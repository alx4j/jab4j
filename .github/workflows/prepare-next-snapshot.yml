name: Prepare Next Snapshot PR

on:
  workflow_dispatch:
    inputs:
      released_version:
        description: Released version currently on main, for example 0.1.0.
        required: true
        type: string
      next_snapshot:
        description: Next development version, for example 0.1.1-SNAPSHOT.
        required: true
        type: string
      auto_merge:
        description: Enable auto-merge for the next snapshot PR.
        required: true
        default: false
        type: boolean

concurrency:
  group: prepare-next-snapshot-${{ inputs.next_snapshot }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare next snapshot PR
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Validate versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          RELEASED_VERSION="${{ inputs.released_version }}"
          NEXT_SNAPSHOT="${{ inputs.next_snapshot }}"

          if [[ ! "$RELEASED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid released version: $RELEASED_VERSION"
            echo "Expected a stable version such as 1.2.3."
            exit 1
          fi

          if [[ ! "$NEXT_SNAPSHOT" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "Invalid next snapshot version: $NEXT_SNAPSHOT"
            echo "Expected a snapshot version such as 1.2.4-SNAPSHOT."
            exit 1
          fi

          CURRENT_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"

          if [[ "$CURRENT_VERSION" != "$RELEASED_VERSION" ]]; then
            echo "Current Maven version must be $RELEASED_VERSION before preparing $NEXT_SNAPSHOT."
            echo "Current Maven version is $CURRENT_VERSION."
            exit 1
          fi

          SAFE_BRANCH_VERSION="${NEXT_SNAPSHOT//./-}"
          echo "branch=release/next-snapshot-$SAFE_BRANCH_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_snapshot=$NEXT_SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "released_version=$RELEASED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set next snapshot version
        env:
          NEXT_SNAPSHOT: ${{ steps.versions.outputs.next_snapshot }}
        run: >
          mvn -B -ntp versions:set
          -DnewVersion="$NEXT_SNAPSHOT"
          -DprocessAllModules=true
          -DgenerateBackupPoms=false

      - name: Validate Maven project
        run: mvn -B -ntp -DskipTests validate

      - name: Create next snapshot PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
          NEXT_SNAPSHOT: ${{ steps.versions.outputs.next_snapshot }}
          RELEASED_VERSION: ${{ steps.versions.outputs.released_version }}
          SNAPSHOT_BRANCH: ${{ steps.versions.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$SNAPSHOT_BRANCH"
          git add pom.xml modules/*/pom.xml

          if git diff --cached --quiet; then
            echo "No Maven version changes to commit."
            exit 1
          fi

          git commit -m "chore: start $NEXT_SNAPSHOT"
          git push --force-with-lease origin "$SNAPSHOT_BRANCH"

          cat > /tmp/next-snapshot-pr.md <<EOF
          ## Summary

          Starts the next development cycle by changing Maven project versions from \`$RELEASED_VERSION\` to \`$NEXT_SNAPSHOT\`.

          ## Validation

          - \`mvn -B -ntp -DskipTests validate\`
          EOF

          if gh pr view "$SNAPSHOT_BRANCH" >/dev/null 2>&1; then
            gh pr edit "$SNAPSHOT_BRANCH" \
              --title "Start $NEXT_SNAPSHOT" \
              --body-file /tmp/next-snapshot-pr.md
            PR_URL="$(gh pr view "$SNAPSHOT_BRANCH" --json url --jq .url)"
          else
            PR_URL="$(gh pr create \
              --base main \
              --head "$SNAPSHOT_BRANCH" \
              --title "Start $NEXT_SNAPSHOT" \
              --body-file /tmp/next-snapshot-pr.md)"
          fi

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: inputs.auto_merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: gh pr merge "$PR_URL" --squash --auto --delete-branch
