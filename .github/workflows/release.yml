name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Validate tag, version, and target commit
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi

          VERSION="${TAG#v}"
          POM_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"

          if [[ "$POM_VERSION" != "$VERSION" ]]; then
            echo "Tag version and pom.xml version do not match."
            echo "Tag:      $TAG"
            echo "Expected: $VERSION"
            echo "pom.xml:  $POM_VERSION"
            exit 1
          fi

          if [[ "$POM_VERSION" == *-SNAPSHOT ]]; then
            echo "Refusing to release a SNAPSHOT version: $POM_VERSION"
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main

          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          MAIN_COMMIT="$(git rev-parse origin/main)"

          if [[ "$TAG_COMMIT" != "$MAIN_COMMIT" ]]; then
            echo "Release tag must point at the current origin/main commit."
            echo "Tag commit:  $TAG_COMMIT"
            echo "Main commit: $MAIN_COMMIT"
            exit 1
          fi

      - name: Verify release build without signing
        run: mvn -B -ntp -Prelease -Dgpg.skip=true clean verify

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-24.04
    needs: validate
    environment: maven-central

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 and Maven publishing credentials
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish signed artifacts
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >
          mvn -B -ntp -Prelease
          -Dcentral.autoPublish=true
          -Dcentral.waitUntil=published
          clean deploy

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
