name: "Release :: Step 2 :: Publish to Maven Central"

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v, for example 0.1.0.
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    outputs:
      create_tag: ${{ steps.release.outputs.create_tag }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Validate tag, version, and target commit
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            TAG="v$VERSION"
            CREATE_TAG=true
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            CREATE_TAG=false
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi

          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Refusing to release a SNAPSHOT version: $VERSION"
            exit 1
          fi

          POM_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"

          if [[ "$POM_VERSION" != "$VERSION" ]]; then
            echo "Tag version and pom.xml version do not match."
            echo "Tag:      $TAG"
            echo "Expected: $VERSION"
            echo "pom.xml:  $POM_VERSION"
            exit 1
          fi

          git fetch origin main:refs/remotes/origin/main --tags

          MAIN_COMMIT="$(git rev-parse origin/main)"

          if [[ "$CREATE_TAG" == "true" ]]; then
            HEAD_COMMIT="$(git rev-parse HEAD)"

            if [[ "$HEAD_COMMIT" != "$MAIN_COMMIT" ]]; then
              echo "Manual release workflow must run from the current origin/main commit."
              echo "HEAD commit: $HEAD_COMMIT"
              echo "Main commit: $MAIN_COMMIT"
              exit 1
            fi

            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              TAG_COMMIT="$(git rev-list -n 1 "$TAG")"

              if [[ "$TAG_COMMIT" != "$MAIN_COMMIT" ]]; then
                echo "Release tag already exists but does not point at current origin/main."
                echo "Tag commit:  $TAG_COMMIT"
                echo "Main commit: $MAIN_COMMIT"
                exit 1
              fi

              echo "Release tag already exists at current origin/main: $TAG"
              CREATE_TAG=false
            fi
          else
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"

            if [[ "$TAG_COMMIT" != "$MAIN_COMMIT" ]]; then
              echo "Release tag must point at the current origin/main commit."
              echo "Tag commit:  $TAG_COMMIT"
              echo "Main commit: $MAIN_COMMIT"
              exit 1
            fi
          fi

          echo "create_tag=$CREATE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release build without signing
        run: mvn -B -ntp -T 2C -Prelease -Dgpg.skip=true clean verify

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-24.04
    needs: validate
    environment: maven-central

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 and Maven publishing credentials
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Create release tag
        if: needs.validate.outputs.create_tag == 'true'
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish signed artifacts
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: >
          mvn -B -ntp -Prelease
          -Dcentral.autoPublish=true
          -Dcentral.waitUntil=validated
          clean deploy

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
