name: Prepare Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v, for example 0.1.0.
        required: true
        type: string
      auto_merge:
        description: Enable auto-merge for the release PR.
        required: true
        default: false
        type: boolean

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION"
            echo "Expected a stable version such as 1.2.3."
            exit 1
          fi

          CURRENT_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"

          if [[ "$CURRENT_VERSION" != *-SNAPSHOT ]]; then
            echo "Current Maven version must be a SNAPSHOT version before preparing a release."
            echo "Current Maven version is $CURRENT_VERSION."
            exit 1
          fi

          echo "branch=release/v$VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >
          mvn -B -ntp versions:set
          -DnewVersion="$RELEASE_VERSION"
          -DprocessAllModules=true
          -DgenerateBackupPoms=false

      - name: Verify release build
        run: mvn -B -ntp -Prelease -Dgpg.skip=true clean verify

      - name: Create release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C "$RELEASE_BRANCH"
          git add pom.xml modules/*/pom.xml

          if git diff --cached --quiet; then
            echo "No Maven version changes to commit."
            exit 1
          fi

          git commit -m "chore: release v$RELEASE_VERSION"
          git push --force-with-lease origin "$RELEASE_BRANCH"

          cat > /tmp/release-pr.md <<EOF
          ## Summary

          Prepares release \`v$RELEASE_VERSION\` by changing Maven project versions from \`$CURRENT_VERSION\` to \`$RELEASE_VERSION\`.

          ## Validation

          - \`mvn -B -ntp -Prelease -Dgpg.skip=true clean verify\`
          EOF

          if gh pr view "$RELEASE_BRANCH" >/dev/null 2>&1; then
            gh pr edit "$RELEASE_BRANCH" \
              --title "Release v$RELEASE_VERSION" \
              --body-file /tmp/release-pr.md
            PR_URL="$(gh pr view "$RELEASE_BRANCH" --json url --jq .url)"
          else
            PR_URL="$(gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "Release v$RELEASE_VERSION" \
              --body-file /tmp/release-pr.md)"
          fi

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: inputs.auto_merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN || github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: gh pr merge "$PR_URL" --squash --auto --delete-branch
