name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify / JDK ${{ matrix.java }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        java:
          - '17'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install optional HEIC tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libheif-examples
          converter_path="$(command -v heif-convert || command -v heif-dec)"
          test -x "$converter_path"
          echo "JAB4J_HEIF_CONVERT=$converter_path" >> "$GITHUB_ENV"

      - name: Verify
        run: |
          mvn -B -ntp -T 2C clean verify \
            -Djab4j.heif.nativeSmoke=true \
            -Djunit.jupiter.execution.parallel.enabled=true \
            -Djunit.jupiter.execution.parallel.mode.default=concurrent \
            -Djunit.jupiter.execution.parallel.mode.classes.default=concurrent \
            -Djunit.jupiter.execution.parallel.config.strategy=fixed \
            -Djunit.jupiter.execution.parallel.config.fixed.parallelism=4
